<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>萬能計算機與圖表繪製 Pro</title>
  <!-- 引入 Chart.js 圖表庫 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-main: #0f172a;
      --panel-bg: #1e293b;
      --sidebar-bg: #0b1329;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --btn-bg: #334155;
      --btn-hover: #475569;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; height: 100vh; background: var(--bg-main); color: var(--text-main); overflow: hidden; }

    #sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    #sidebar .logo { padding: 20px; font-size: 1.2rem; font-weight: bold; color: var(--accent); border-bottom: 1px solid var(--border); }
    #sidebar nav { flex: 1; overflow-y: auto; padding: 10px; }
    .nav-category { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); margin: 15px 10px 5px; font-weight: bold; }
    .nav-btn { width: 100%; text-align: left; padding: 10px 12px; background: none; border: none; color: var(--text-muted); border-radius: 6px; cursor: pointer; transition: all 0.2s; font-size: 0.9rem; }
    .nav-btn:hover { background: var(--panel-bg); color: var(--text-main); }
    .nav-btn.active { background: var(--accent); color: #fff; font-weight: bold; }

    #main-content { flex: 1; overflow-y: auto; padding: 30px; position: relative; }
    .page { display: none; height: 100%; flex-direction: column; gap: 20px; }
    .page.active { display: flex; }
    .page-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 10px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }

    .card { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
    input, select, button, textarea { background: var(--btn-bg); border: 1px solid var(--border); color: var(--text-main); padding: 10px 14px; border-radius: 6px; font-size: 1rem; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    button { cursor: pointer; transition: 0.2s; }
    button:hover { background: var(--btn-hover); }
    button.primary { background: var(--accent); border-color: var(--accent); }
    button.primary:hover { background: var(--accent-hover); }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; color: var(--text-muted); }
    .chart-container { position: relative; width: 100%; height: 350px; }
  </style>
</head>
<body>

  <aside id="sidebar">
    <div class="logo">萬能圖表計算機</div>
    <nav>
      <div class="nav-category">數據與視覺化</div>
      <button class="nav-btn active" onclick="switchTab('page-chart', event)">統計圖表生成器</button>
      <button class="nav-btn" onclick="switchTab('page-finance-chart', event)">房貸與複利趨勢圖</button>
    </nav>
  </aside>

  <main id="main-content">

    <!-- 1. 自訂數據統計圖表 -->
    <div id="page-chart" class="page active">
      <div class="page-title">數據統計圖表生成器</div>
      <div class="grid-2">
        <div class="card form-group">
          <h3>輸入數據</h3>
          <label>圖表標題</label>
          <input type="text" id="chart-title" value="每月收支統計" />
          
          <label>圖表類型</label>
          <select id="chart-type" onchange="generateChart()">
            <option value="bar">長條圖 (Bar)</option>
            <option value="line">折線圖 (Line)</option>
            <option value="pie">圓餅圖 (Pie)</option>
          </select>

          <label>資料標籤 (用逗號分開)</label>
          <input type="text" id="chart-labels" value="一月, 二月, 三月, 四月, 五月" />

          <label>對應數值 (用逗號分開)</label>
          <input type="text" id="chart-data" value="1200, 1900, 3000, 5000, 2400" />

          <button class="primary" onclick="generateChart()">生成圖表</button>
        </div>

        <div class="card">
          <h3>圖表預覽</h3>
          <div class="chart-container">
            <canvas id="customCanvas"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. 理財趨勢動態圖表 -->
    <div id="page-finance-chart" class="page">
      <div class="page-title">定期定額複利成長趨勢圖</div>
      <div class="grid-2">
        <div class="card form-group">
          <label>每月投資金額 (元)</label>
          <input type="number" id="invest-m" value="10000" />
          <label>預期年報酬率 (%)</label>
          <input type="number" id="invest-r" value="7" />
          <label>投資年限 (年)</label>
          <input type="number" id="invest-y" value="15" />
          <button class="primary" onclick="renderFinanceChart()">計算並繪製資產曲線</button>
        </div>

        <div class="card">
          <h3>資產累積歷程</h3>
          <div class="chart-container">
            <canvas id="financeCanvas"></canvas>
          </div>
        </div>
      </div>
    </div>

  </main>

  <script>
    function switchTab(pageId, event) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      event.target.classList.add('active');
    }

    // 自訂圖表繪製邏輯
    let customChartInstance = null;
    function generateChart() {
      const ctx = document.getElementById('customCanvas').getContext('2d');
      const title = document.getElementById('chart-title').value;
      const type = document.getElementById('chart-type').value;
      const labels = document.getElementById('chart-labels').value.split(',').map(s => s.trim());
      const data = document.getElementById('chart-data').value.split(',').map(s => parseFloat(s.trim()) || 0);

      if (customChartInstance) customChartInstance.destroy();

      customChartInstance = new Chart(ctx, {
        type: type,
        data: {
          labels: labels,
          datasets: [{
            label: title,
            data: data,
            backgroundColor: [
              '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'
            ],
            borderColor: '#1e293b',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#f8fafc' } }
          },
          scales: type !== 'pie' ? {
            x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
            y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
          } : {}
        }
      });
    }

    // 複利趨勢圖繪製邏輯
    let financeChartInstance = null;
    function renderFinanceChart() {
      const ctx = document.getElementById('financeCanvas').getContext('2d');
      const m = parseFloat(document.getElementById('invest-m').value) || 0;
      const rate = (parseFloat(document.getElementById('invest-r').value) || 0) / 100 / 12;
      const years = parseInt(document.getElementById('invest-y').value) || 0;

      let labels = [];
      let principalData = []; // 本金
      let totalData = [];     // 本利和

      let currentTotal = 0;
      for (let y = 1; y <= years; y++) {
        labels.push(`第 ${y} 年`);
        for (let month = 0; month < 12; month++) {
          currentTotal = (currentTotal + m) * (1 + rate);
        }
        principalData.push(m * 12 * y);
        totalData.push(Math.round(currentTotal));
      }

      if (financeChartInstance) financeChartInstance.destroy();

      financeChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: '預估資產總額 (本利和)',
              data: totalData,
              borderColor: '#10b981',
              backgroundColor: 'rgba(16, 185, 129, 0.2)',
              fill: true
            },
            {
              label: '投入總本金',
              data: principalData,
              borderColor: '#3b82f6',
              borderDash: [5, 5]
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#f8fafc' } }
          },
          scales: {
            x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
            y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
          }
        }
      });
    }

    // 頁面加載時自動生成預設圖表
    window.onload = () => {
      generateChart();
      renderFinanceChart();
    };
  </script>
</body>
</html>
